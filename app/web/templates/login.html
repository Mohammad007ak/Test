{% extends "base.html" %}
{% from "_ui.html" import icon %}
{% block shell %}
<main class="auth">
  <img class="brand-logo" src="{{ static('logo.svg') }}" alt="" width="88" height="88">
  <h1 class="brand-name">{{ s.APP_NAME }}<span class="brand-dot">.</span></h1>
  <p class="brand-tag">{{ s.TAGLINE }}</p>
  <p class="muted">{{ T.login_hint }}</p>
  {% if error %}<div class="alert danger">{{ icon("alert") }} {{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <div class="input"><input id="phone" type="tel" name="phone" value="{{ phone or '' }}" inputmode="tel" autocomplete="username" dir="ltr" placeholder="{{ T.phone_placeholder }}" aria-label="{{ T.phone }}" required autofocus></div>
    <div class="input"><input id="password" type="password" name="password" autocomplete="current-password" placeholder="{{ T.password }}" aria-label="{{ T.password }}" required></div>
    <button type="submit" class="btn wide">{{ T.login }}</button>
  </form>
  <div class="passkey-login" data-passkey-login-box hidden data-error="{{ T.passkey_failed }}">
    <span class="or">{{ T.passkey_or }}</span>
    <button type="button" class="btn ghost wide" data-passkey-login>{{ icon("face") }} {{ T.passkey_login }}</button>
    <p class="error" data-passkey-error hidden></p>
  </div>
  <a href="/forgot" class="auth-link">{{ T.forgot }}</a>
  <p class="auth-alt">{{ T.no_account }} <a href="/signup">{{ T.signup }}</a></p>
</main>
{% endblock %}
