<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ s.APP_NAME }}">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/css/app.css">
  <title>{% block title %}{{ s.APP_NAME }}{% endblock %}</title>
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
{% block header %}
<header class="top">
  <div class="top-inner">
    <span class="brand">{{ s.APP_NAME }}</span>
    <nav class="tabs">
      {% for key, label in s.NAV.items() %}
        <a href="{{ '/' if key == 'dashboard' else '/' ~ key }}" class="{{ 'on' if active == key }}">{{ label }}</a>
      {% endfor %}
    </nav>
    <form method="post" action="/logout"><button class="ghost small" type="submit">{{ T.logout }}</button></form>
  </div>
</header>
{% endblock %}
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/js/app.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
