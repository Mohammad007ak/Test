{% extends "base.html" %}
{% from "_fields.html" import field %}
{% block content %}
<form method="post" action="/settings" class="form card" novalidate>
  <div class="fields">{% for f in fields %}{{ field(f, values, errors) }}{% endfor %}</div>
  <button type="submit" class="btn wide">{{ T.save }}</button>
</form>
{% endblock %}
