{% extends "base.html" %}
{% from "_fields.html" import field %}
{% block content %}
<h1>{{ T.settings_title }}</h1>
{% if message %}<div class="alert ok">{{ message }}</div>{% endif %}
<div class="card">
  <form method="post" action="/settings" class="stack">
    {% for f in fields %}{{ field(f, values, errors) }}{% endfor %}
    <div class="form-actions full"><button type="submit">{{ T.save }}</button></div>
  </form>
</div>
<div class="card">
  <h2>{{ T.export }}</h2>
  <p class="muted small">{{ T.export_hint }}</p>
  <a class="btn ghost" href="/export.json">{{ T.export }}</a>
</div>
{% endblock %}
