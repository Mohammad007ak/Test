{% extends "projects/base.html" %}
{% block content %}
<h1>پروژه‌های دارای تأخیر</h1>
<div class="card">
    <table>
        <tr><th>پروژه</th><th>مجری</th><th>میزان تأخیر</th></tr>
        {% for row in rows %}
        <tr>
            <td><a href="{% url 'project_profile' row.project.pk %}">{{ row.project.code }} - {{ row.project.title }}</a></td>
            <td>{{ row.project.executor }}</td>
            <td><span class="badge badge-danger">{{ row.delay }}%</span></td>
        </tr>
        {% empty %}
        <tr><td colspan="3">پروژه‌ی دارای تأخیر یافت نشد.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
