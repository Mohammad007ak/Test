{% extends "projects/base.html" %}
{% block content %}
<h1>ظرفیت آزاد</h1>
<div class="card">
    <table>
        <tr><th>نام</th><th>نوع</th><th>تخصص</th><th>ظرفیت آزاد</th></tr>
        {% for row in rows %}
        <tr>
            <td>{{ row.person }}</td>
            <td>{{ row.type }}</td>
            <td>{{ row.specialty|default:"-" }}</td>
            <td>{{ row.free_percent }}%</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">فردی با ظرفیت آزاد یافت نشد.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
