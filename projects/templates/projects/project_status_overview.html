{% extends "projects/base.html" %}
{% block content %}
<h1>وضعیت کلی پروژه‌ها</h1>
<div class="card">
    <p>مجموع پروژه‌ها: <strong>{{ total }}</strong></p>
    <table>
        <tr><th>وضعیت</th><th>تعداد</th></tr>
        {% for row in data %}
        <tr><td>{{ row.status }}</td><td>{{ row.total }}</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
