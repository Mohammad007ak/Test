{% extends "projects/base.html" %}
{% block content %}
<h1>گزارش‌های در دسترس شما</h1>
<div class="card">
    <ul>
    {% for url, label in reports %}
        <li><a href="{% url url %}">{{ label }}</a></li>
    {% empty %}
        <li>گزارشی برای نقش شما تعریف نشده است.</li>
    {% endfor %}
    </ul>
</div>
{% endblock %}
