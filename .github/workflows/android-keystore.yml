# یک بار اجرا کن تا کلید امضای اپ اندروید ساخته شود (روی سرور GitHub، نه در مخزن).
# خروجی یک artifact است با فایل کلید و رمزها؛ آن‌ها را در Settings > Secrets > Actions بگذار
# و بعد artifact را پاک کن. این کلید را گم نکن: بدون آن به‌روزرسانی اپ ممکن نیست.
name: Android signing key (one time)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          keytool -genkeypair -v -keystore vazir.jks -alias vazir -keyalg RSA -keysize 4096 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Vazir, O=getvazir.ir, C=IR"
          mkdir out
          base64 -w0 vazir.jks > out/ANDROID_KEYSTORE_BASE64.txt
          echo "$PASS" > out/ANDROID_KEYSTORE_PASSWORD.txt
          echo "$PASS" > out/ANDROID_KEY_PASSWORD.txt
          echo "vazir" > out/ANDROID_KEY_ALIAS.txt
          cp vazir.jks out/vazir-backup.jks
      - uses: actions/upload-artifact@v4
        with:
          name: vazir-android-signing-key
          path: out/
          retention-days: 1
