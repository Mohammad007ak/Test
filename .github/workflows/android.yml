# ساخت فایل نصبی اندروید (APK) وزیر روی سرورهای GitHub.
# - با Secrets امضا (ANDROID_KEYSTORE_BASE64، ANDROID_KEYSTORE_PASSWORD، ANDROID_KEY_ALIAS،
#   ANDROID_KEY_PASSWORD): نسخه release امضاشده که می‌شود به‌روزش کرد و در بازار/مایکت گذاشت،
#   و در Releases منتشر می‌شود (لینک ثابت: releases/latest/download/vazir.apk).
# - بدون Secrets: نسخه آزمایشی (debug) فقط برای امتحان روی گوشی.
# کلید امضا هرگز این‌جا ساخته نمی‌شود (مخزن عمومی است)؛ روی کامپیوتر صاحب اپ ساخته می‌شود.
# نسخه از android/VERSION خوانده می‌شود؛ تغییر آن ساخت تازه را شروع می‌کند.
# اثر انگشت SHA-256 امضا در خلاصه اجرا چاپ می‌شود تا در FINASSIST_ANDROID_CERT_SHA256 بگذاری.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vazir.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/vazir.jks" >> "$GITHUB_ENV"
          fi

      - name: Version
        run: echo "VERSION_NAME=$(tr -d '[:space:]' < android/VERSION)" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vazir.apk"
            echo "KIND=release" >> "$GITHUB_ENV"
          else
            gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/vazir.apk"
            echo "KIND=debug" >> "$GITHUB_ENV"
          fi

      - name: Signing fingerprint
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs vazir.apk | grep -m1 "SHA-256" | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          {
            echo "### APK وزیر ($KIND)"
            echo ""
            echo "FINASSIST_ANDROID_CERT_SHA256=$SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vazir-apk-${{ env.KIND }}-${{ github.run_number }}
          path: vazir.apk
          retention-days: 30

      - name: Publish release
        if: env.KIND == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: وزیر اندروید ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: vazir.apk
