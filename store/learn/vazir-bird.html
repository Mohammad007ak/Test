<title>پرنده وزیر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;600;900&display=swap">
<style>
/* لایه‌بندی: یک صحنه بزرگ برای شخصیت و دکمه‌های حالت، زیرش ردیف حالت‌ها روی پس‌زمینه تیره اپ. */
:root {
  --bg: #030c08; --surface: #0d1c15; --line: rgba(62,232,166,.16);
  --fg: #f2f5f1; --fg-2: rgba(242,245,241,.68); --accent: #3ee8a6; --gold: #f5c76a;
  --stage: #fbf7ee;
  --font: "Vazirmatn", Tahoma, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); direction: rtl; padding-inline: 16px; }
main { max-width: 760px; margin: 0 auto; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 900; }
.lead { margin: -8px 0 0; color: var(--fg-2); line-height: 1.9; }
.card { background: var(--surface); border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 0 0 1px var(--line); }
.stage { position: relative; background: radial-gradient(70% 60% at 50% 40%, #fff, var(--stage)); border-radius: 20px; aspect-ratio: 1 / 1; max-width: 100%; max-height: 72vh; margin: 0 auto; width: 100%; }
.stage svg { position: absolute; left: 4%; top: 4%; width: 92%; height: 92%; overflow: visible; }
.moods { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.moods button { font: inherit; font-weight: 600; font-size: .92rem; color: var(--fg); background: #132a20; border: 0; border-radius: 12px; padding: 9px 15px; cursor: pointer; box-shadow: 0 3px 0 #07120d; }
.moods button[aria-pressed="true"] { background: var(--accent); color: #04140d; box-shadow: 0 3px 0 #179b68; }
.moods button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #0b1f17; border-radius: 20px; padding: 12px 8px; }
.strip figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.strip svg { width: 100%; height: auto; overflow: visible; }
.strip figcaption { font-size: .75rem; color: var(--fg-2); }

/* حرکت‌ها */
.rig { transform-box: view-box; transform-origin: 120px 290px; }
.idle .rig { animation: idle 2.8s ease-in-out infinite; }
@keyframes idle { 50% { transform: translateY(-3px) scaleY(1.012); } }
.happy .rig { animation: hop .5s cubic-bezier(.34,1.56,.64,1) infinite alternate; }
.party .rig { animation: hop .38s cubic-bezier(.34,1.56,.64,1) infinite alternate; }
@keyframes hop { from { transform: translateY(0) scaleY(.975); } to { transform: translateY(-14px) scaleY(1.02); } }
.think .rig { animation: tilt 3.2s ease-in-out infinite; }
@keyframes tilt { 50% { transform: rotate(-2deg); } }
.sad .rig { animation: sag 3s ease-in-out infinite; }
@keyframes sag { 50% { transform: translateY(3px) scaleY(.985); } }
.shadow { transform-box: fill-box; transform-origin: center; }
.happy .shadow { animation: shrink .5s cubic-bezier(.34,1.56,.64,1) infinite alternate; }
.party .shadow { animation: shrink .38s cubic-bezier(.34,1.56,.64,1) infinite alternate; }
@keyframes shrink { to { transform: scaleX(.78); opacity: .55; } }
.blink { transform-box: fill-box; transform-origin: center; animation: blink 4.4s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
.feather { transform-box: fill-box; transform-origin: 50% 100%; animation: feather 2.8s ease-in-out infinite; }
@keyframes feather { 50% { transform: rotate(7deg); } }
.party .feather, .happy .feather { animation-duration: .5s; }
.finger { transform-box: fill-box; transform-origin: 50% 100%; animation: wag 1.4s ease-in-out infinite; }
@keyframes wag { 50% { transform: rotate(-10deg); } }
.spark { opacity: 0; transform-box: fill-box; transform-origin: center; }
.party .spark, .happy .spark { animation: spark .9s ease-out infinite; }
.spark.s2 { animation-delay: .3s !important; } .spark.s3 { animation-delay: .6s !important; }
@keyframes spark { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.15) translateY(-8px); } }
.dots circle { animation: dot 1.4s ease-in-out infinite; }
.dots circle:nth-child(2) { animation-delay: .2s; } .dots circle:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.wave { transform-box: fill-box; transform-origin: 30% 95%; animation: wave .8s ease-in-out infinite alternate; }
@keyframes wave { to { transform: rotate(-14deg); } }
.wing { transform-box: fill-box; }
.wing.l { transform-origin: 85% 15%; } .wing.r { transform-origin: 15% 15%; }
.party .wing.l { animation: flapL .22s ease-in-out infinite alternate; }
.party .wing.r { animation: flapR .22s ease-in-out infinite alternate; }
@keyframes flapL { to { transform: rotate(-16deg); } }
@keyframes flapR { to { transform: rotate(16deg); } }
.q { animation: dot 1.4s ease-in-out infinite; }
</style>

<main>
  <h1>پرنده وزیر</h1>
  <p class="lead">همان پرنده سبزِ طرح چت‌جی‌پی‌تی، ساده و تخت، با کد کشیده شده تا در اپ پلک بزند، بپرد و حالتش با جواب کاربر عوض شود. روی دکمه‌ها بزن.</p>
  <section class="card">
    <div class="stage" id="stage"></div>
    <div class="moods" role="group" aria-label="حالت پرنده" id="moods"></div>
  </section>
  <section class="card">
    <div class="strip" id="strip"></div>
  </section>
</main>

<script>
const MOODS = [["idle", "سلام"], ["think", "فکر"], ["happy", "جواب درست"], ["sad", "جواب غلط"], ["party", "پایان درس"]];
const C = { body: "#2cb57b", shade: "#1f9b67", deep: "#0d4a35", wing: "#1d9363", wingDark: "#167a52",
            mint: "#c6f2db", mintShade: "#a9e6c8", scarf: "#0f5a40", scarfDark: "#0a4431",
            beak: "#ffcf4d", beakShade: "#f0a92e", mouth: "#e2566c", tongue: "#ff8a9b", gold: "#f5c76a", feet: "#ffc23d", feetShade: "#eea62b" };
let uid = 0;

// بال: شکل پر با نوک کنگره‌ای، آویزان از شانه؛ angle با دست راست قرینه می‌شود
function wing(side, angle, cls = "") {
  const [x, y, f] = side === "l" ? [80, 192, 1] : [160, 192, -1];
  return `<g class="wing ${side} ${cls}"><g transform="translate(${x} ${y}) scale(${f} 1) rotate(${angle})">
    <path d="M4 -4 C-20 2 -32 30 -28 60 C-27 70 -19 74 -13 68 C-9 76 -1 75 2 66 C8 71 15 64 13 54 C14 30 14 8 4 -4Z" fill="${C.wing}"/>
    <path d="M-2 10 C-14 22 -20 44 -18 62 C-16 66 -13 66 -13 68 C-19 74 -27 70 -28 60 C-32 30 -20 2 4 -4 C2 2 0 6 -2 10Z" fill="${C.wingDark}"/></g></g>`;
}
function eye(cx, m, look, side) {
  const y = 108, id = `e${++uid}`;
  if (m === "closed") return `<path d="M${cx - 15} ${y + 4} Q${cx} ${y - 14} ${cx + 15} ${y + 4}" stroke="${C.deep}" stroke-width="6.5" fill="none" stroke-linecap="round"/>`;
  // پلک: درصد پوشش لبه بیرونی و درونی
  const lid = { sad: side === "l" ? [-2, -16] : [-16, -2], skeptic: [-8, -8] }[m];
  const [lo, li] = lid || [null, null];
  const lidPath = lid ? `<path clip-path="url(#${id})" d="M${cx - 30} ${y + (side === "l" ? lo : li)} L${cx + 30} ${y + (side === "l" ? li : lo)} L${cx + 30} ${y - 40} L${cx - 30} ${y - 40}Z" fill="${C.mint}"/>
      <path clip-path="url(#${id})" d="M${cx - 30} ${y + (side === "l" ? lo : li)} L${cx + 30} ${y + (side === "l" ? li : lo)}" stroke="${C.deep}" stroke-width="4"/>` : "";
  return `<clipPath id="${id}"><circle cx="${cx}" cy="${y}" r="25"/></clipPath>
    <g class="blink"><circle cx="${cx}" cy="${y}" r="25" fill="#fff"/>
    <path clip-path="url(#${id})" d="M${cx - 25} ${y + 12} Q${cx} ${y + 30} ${cx + 25} ${y + 12} L${cx + 25} ${y + 30} L${cx - 25} ${y + 30}Z" fill="#e3f6ec"/>
    <circle cx="${cx + look[0]}" cy="${y + 2 + look[1]}" r="16" fill="${C.deep}"/>
    <circle cx="${cx + 6 + look[0]}" cy="${y - 5 + look[1]}" r="6" fill="#fff"/><circle cx="${cx - 6 + look[0]}" cy="${y + 9 + look[1]}" r="2.6" fill="#fff" opacity=".85"/>
    ${lidPath}</g>`;
}
function brow(cx, tilt, lift = 0) {  // ابروی کلفت کوتاه؛ tilt مثبت = گوشه بیرونی پایین‌تر (ناراحت)
  const y = 72 - lift, s = cx < 120 ? 1 : -1;
  return `<path d="M${cx - 13} ${y + tilt * s} Q${cx} ${y - 8} ${cx + 13} ${y - tilt * s}" stroke="${C.deep}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
}
function star(x, y, s, fill, cls) {
  return `<path class="spark ${cls}" d="M${x} ${y - s} Q${x + s * .18} ${y - s * .18} ${x + s} ${y} Q${x + s * .18} ${y + s * .18} ${x} ${y + s} Q${x - s * .18} ${y + s * .18} ${x - s} ${y} Q${x - s * .18} ${y - s * .18} ${x} ${y - s}Z" fill="${fill}"/>`;
}
function bird(m) {
  const look = { think: [6, -8], sad: [-2, 6], idle: [3, 0], happy: [2, 0] }[m] || [0, 0];
  const eyes = m === "party" ? eye(92, "closed") + eye(148, "closed")
    : m === "happy" ? eye(92, "open", look, "l") + eye(148, "closed")
    : m === "sad" ? eye(92, "sad", look, "l") + eye(148, "sad", look, "r")
    : m === "think" ? eye(92, "skeptic", look, "l") + eye(148, "open", look, "r")
    : eye(92, "open", look, "l") + eye(148, "open", look, "r");
  const brows = { idle: brow(92, 1) + brow(148, 1), think: brow(92, 0, -2) + brow(148, -3, 8), happy: brow(92, 1, 3) + brow(148, 1, 3),
                  sad: brow(92, 7, 2) + brow(148, 7, 2), party: brow(92, 2, 6) + brow(148, 2, 6) }[m];
  const mouthOpen = { idle: 10, happy: 16, party: 24 }[m];
  const mouth = mouthOpen ? `<path d="M108 138 Q120 ${138 + mouthOpen} 132 138Z" fill="${C.mouth}"/><path d="M113 ${138 + mouthOpen * .45} Q120 ${138 + mouthOpen * .9} 127 ${138 + mouthOpen * .45} Q120 ${138 + mouthOpen * .35} 113 ${138 + mouthOpen * .45}Z" fill="${C.tongue}"/>` : "";
  const beak = `${mouth}<path d="M106 128 Q120 118 134 128 Q131 138 120 ${m === "sad" ? 147 : 144} Q109 138 106 128Z" fill="${C.beak}"/>
    <path d="M108 134 Q120 140 132 134 Q128 141 120 ${m === "sad" ? 147 : 144} Q112 141 108 134Z" fill="${C.beakShade}"/>
    <ellipse cx="115" cy="126" rx="5" ry="2.4" fill="#fff" opacity=".55"/>`;
  const [back, front] = {
    idle: [wing("l", 0), `<g class="wave">${wing("r", 123)}</g>`],
    think: [wing("l", 0), wing("r", -158)],
    happy: [wing("l", 0), wing("r", 118)],
    sad: [wing("l", -6) + wing("r", -6), ""],
    party: ["", wing("l", 126) + wing("r", 126)],
  }[m];
  const q = `<g class="q" transform="translate(196 50) scale(-1 1)"><path d="M-12 0 q0 -14 13 -14 q13 0 13 12 q0 9 -12 13 v7" stroke="${C.body}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="2" cy="30" r="4.5" fill="${C.body}"/></g>`;
  const extra = m === "think" ? q
    : m === "sad" ? `<path d="M182 92 q7 12 0 19 q-7 -7 0 -19z" fill="#5ac8fa"/>`
    : (m === "happy" || m === "party") ? star(200, 70, 11, C.gold, "") + star(42, 88, 8, C.body, "s2") + star(206, 150, 7, C.body, "s3") : "";
  const blush = m === "happy" || m === "party" ? .5 : .28;
  return `<svg viewBox="20 6 200 292" role="img" aria-label="پرنده وزیر">
    <ellipse class="shadow" cx="120" cy="288" rx="56" ry="7" fill="#000" opacity=".12"/>
    <g class="rig">
      ${[[100, 1], [140, 1]].map(([x]) => `<g><ellipse cx="${x}" cy="280" rx="20" ry="7" fill="${C.feetShade}"/>
        <ellipse cx="${x - 11}" cy="277" rx="8.5" ry="6.5" fill="${C.feet}"/><ellipse cx="${x}" cy="275" rx="9" ry="7" fill="${C.feet}"/><ellipse cx="${x + 11}" cy="277" rx="8.5" ry="6.5" fill="${C.feet}"/></g>`).join("")}
      <path d="M80 170 C70 198 66 236 74 256 C82 274 100 280 120 280 C140 280 158 274 166 256 C174 236 170 198 160 170Z" fill="${C.body}"/>
      <path d="M152 176 C166 200 172 236 164 258 C156 272 142 278 126 280 C150 268 160 246 160 222 C160 202 156 188 152 176Z" fill="${C.shade}"/>
      <path d="M90 198 C84 228 90 262 120 268 C150 262 156 228 150 198 C140 208 100 208 90 198Z" fill="${C.mint}"/>
      <path d="M108 226 l6 5 l6 -5 M120 240 l6 5 l6 -5 M104 248 l6 5 l6 -5" stroke="${C.mintShade}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="120" cy="180" rx="46" ry="10" fill="${C.shade}"/>
      ${back}
      <g class="feather">
        <path d="M110 46 C102 32 106 20 116 12 C115 24 120 34 126 44Z" fill="${C.shade}"/>
        <path d="M118 44 C120 28 132 16 150 15 C140 23 136 34 136 46Z" fill="${C.body}"/>
        <path d="M132 46 C140 36 152 32 164 34 C153 38 147 44 143 50Z" fill="${C.shade}"/></g>
      <path d="M120 38 C178 38 200 64 200 110 C200 154 172 178 120 178 C68 178 40 154 40 110 C40 64 62 38 120 38Z" fill="${C.body}"/>
      <path d="M168 50 C192 66 200 90 200 112 C200 150 178 174 136 178 C172 162 188 140 188 110 C188 84 180 64 168 50Z" fill="${C.shade}"/>
      <ellipse cx="82" cy="62" rx="24" ry="9" transform="rotate(-22 82 62)" fill="#fff" opacity=".14"/>
      <circle cx="92" cy="110" r="35" fill="${C.mint}"/><circle cx="148" cy="110" r="35" fill="${C.mint}"/><ellipse cx="120" cy="126" rx="30" ry="26" fill="${C.mint}"/>
      <ellipse cx="62" cy="140" rx="10" ry="6" fill="#ff8fa3" opacity="${blush}"/><ellipse cx="178" cy="140" rx="10" ry="6" fill="#ff8fa3" opacity="${blush}"/>
      ${eyes}${brows}${beak}
      <path d="M78 168 C100 180 140 180 162 168 L156 182 L120 216 L84 182Z" fill="${C.scarf}"/>
      <path d="M120 216 L104 196 Q120 204 136 196Z" fill="${C.scarfDark}"/>
      <path d="M84 182 Q120 194 156 182" stroke="${C.scarfDark}" stroke-width="3" fill="none"/>
      <path d="M120 186 l8 9 l-8 9 l-8 -9z" fill="${C.gold}"/><path d="M120 186 l4 4.5 l-4 4.5 l-4 -4.5z" fill="#fff3c9"/>
      ${front}
    </g>${extra}</svg>`;
}

const stage = document.getElementById("stage"), moods = document.getElementById("moods");
function set(m) {
  stage.className = "stage " + m; stage.innerHTML = bird(m);
  moods.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === m)));
}
MOODS.forEach(([m, label]) => {
  const b = document.createElement("button"); b.type = "button"; b.dataset.m = m; b.textContent = label;
  b.onclick = () => set(m); moods.appendChild(b);
});
document.getElementById("strip").innerHTML = MOODS.map(([m, label]) => `<figure class="${m}">${bird(m)}<figcaption>${label}</figcaption></figure>`).join("");
set("idle");
</script>
